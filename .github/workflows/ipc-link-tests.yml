name: IPC-link-tests

on:
  push:
    branches: [ main, model_b ]
  pull_request:
    branches: [ main ]

jobs:
  test-transport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Transport & Watchdog Tests
        # Focuses strictly on the public IPC link logic
        run: npx vitest run packages/client/src/links/ipcLink.test.ts
