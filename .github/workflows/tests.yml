name: Veritas Core Tests

on:
  push:
    branches: [ main, model_b ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run IPC Bridge Tests
        # We target the specific package to keep the CI fast
        run: npx vitest run packages/client/src/links/ipcLink.test.ts
